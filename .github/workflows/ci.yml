name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run formatter
        run: pixi run fmt

      - name: Assert no uncommitted formatting changes
        run: git diff --exit-code

      # Runs even if the format check failed.
      - name: Run tests
        if: ${{ !cancelled() }}
        run: pixi run test
