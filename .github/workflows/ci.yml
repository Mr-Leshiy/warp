name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run formatter
        run: pixi run fmt

      - name: Assert no uncommitted formatting changes
        run: git diff --exit-code

  test:
    name: Test suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Known-failing: one free GitHub-hosted runner per platform in
    # pixi.toml's `platforms` list (linux-64, linux-aarch64, osx-arm64).
    # None of these have a GPU, and all tests now require one -- see
    # scripts/test.py's docstring. continue-on-error keeps the job visible
    # without red-X'ing the workflow until GPU-enabled runners are wired up.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run test
